<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Poltergeist</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>Poltergeist</h1>
    <div id="status" class="status" role="status" aria-live="polite" data-state="loading">
      <p id="status-text">Checking this tab…</p>
      <p id="notice" class="notice" hidden></p>
    </div>
    <form id="controls" class="controls">
      <label class="control" for="pause">
        <input type="checkbox" id="pause" name="pause" disabled>
        <span>Pause on this tab</span>
      </label>
      <label class="control" for="demo">
        <input type="checkbox" id="demo" name="demo" disabled>
        <span>Demo mode on supported tabs</span>
      </label>
    </form>
  </main>
</body>
</html>
